name: "Mark stale issues and pull requests"

on:
  schedule:
    - cron: '45 8 * * *'

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
    - uses: actions/stale@v9
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        days-before-stale: 60
        days-before-close: 7
        stale-issue-message: 'This issue has been automatically marked as stale due to 60 days of inactivity. It will be closed in 7 days if no further activity occurs.'
        stale-pr-message: 'This pull request has been automatically marked as stale due to 60 days of inactivity. It will be closed in 7 days if no further activity occurs.'
        stale-issue-label: 'stale'
        stale-pr-label: 'stale'
        exempt-issue-labels: 'pinned,security'
        exempt-pr-labels: 'pinned,security'
